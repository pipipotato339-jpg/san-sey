<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="San Sey">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="sansey-icon-192.png">
<link rel="apple-touch-icon" href="sansey-icon-192.png">
<title>San Sey OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--accent:#f2f2f2;--onacc:#000;--bg:#000;--fg:#f2f2f2;--card:#121212;--card2:#1b1b1b;--muted:#8a8a8a;--line:#222;--glass:rgba(255,255,255,.08);--gline:rgba(255,255,255,.13);--wall:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;font-family:'Manrope',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;color:#f2f2f2}
body{display:flex;align-items:center;justify-content:center}
#device{width:390px;height:844px;max-height:96vh;border-radius:56px;border:10px solid #111;box-shadow:0 0 0 1.5px #3a3a3a,0 30px 80px rgba(0,0,0,.8);overflow:hidden;position:relative}
@media (max-width:520px){#device{width:100vw;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}}
:fullscreen #device{width:100vw;height:100vh;max-height:none;border:0;border-radius:0}
#screen{position:absolute;inset:0;overflow:hidden;background:#000}
#wp{position:absolute;inset:-4%;background:var(--wall);background-size:cover;background-position:center;transition:transform .25s ease-out}
svg{width:100%;height:100%}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
input,textarea{font-family:inherit;user-select:text;-webkit-user-select:text}

#status{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:700;z-index:160;color:#fff;cursor:pointer;letter-spacing:.02em}
#status .r{display:flex;gap:7px;align-items:center}
#status .r i{display:inline-block;width:15px;height:15px}
.batt{width:23px;height:11px;border:1.5px solid currentColor;border-radius:3.5px;position:relative;padding:1.5px}
.batt b{display:block;height:100%;background:currentColor;border-radius:1px}
.batt:after{content:"";position:absolute;right:-4px;top:2.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
#sbPct{font-size:12px}

#boot{position:absolute;inset:0;background:#000;z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .7s}
#boot .logo{width:88px;height:88px;animation:rise 2.2s cubic-bezier(.2,.8,.2,1)}
#boot .word{font-weight:300;letter-spacing:.55em;font-size:19px;opacity:0;animation:fadeup 1s .9s forwards;padding-left:.55em}
#boot .sub{font-size:10px;color:#666;letter-spacing:.35em;opacity:0;animation:fadeup 1s 1.4s forwards;padding-left:.35em}
@keyframes rise{0%{transform:translateY(30px) scale(.6);opacity:0;filter:blur(8px)}100%{transform:none;opacity:1;filter:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* lock */
#lock{position:absolute;inset:0;z-index:150;display:flex;flex-direction:column;align-items:center;padding-top:120px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s;touch-action:none;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.45))}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
#lock .t{font-size:104px;font-weight:200;letter-spacing:-4px;line-height:1}
#lock .d{font-size:16px;font-weight:500;margin-top:10px;opacity:.8;letter-spacing:.04em}
#lock .chip{margin-top:26px;display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;background:var(--glass);border:1px solid var(--gline);padding:8px 14px;border-radius:20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#lock .chip i{width:15px;height:15px;display:inline-block}
#lock .model{position:absolute;bottom:100px;font-size:10px;letter-spacing:.4em;opacity:.45;font-weight:600;padding-left:.4em}
#lock .hint{position:absolute;bottom:62px;font-size:12.5px;font-weight:600;opacity:.75;animation:bob 2.2s infinite;letter-spacing:.06em}
#lock .bar{position:absolute;bottom:22px;width:130px;height:5px;border-radius:3px;background:#fff;opacity:.8}
@keyframes bob{50%{transform:translateY(-6px)}}
#screen.locked #home,#screen.locked #nav{visibility:hidden}

/* home */
#home{position:absolute;inset:0;display:flex;flex-direction:column}
#editBar{position:absolute;top:38px;left:16px;right:16px;display:none;justify-content:space-between;z-index:30}
#editBar button{background:#fff;color:#000;font-weight:800;font-size:13px;padding:8px 16px;border-radius:16px}
#pages{flex:1;margin-top:34px;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x}
#pages::-webkit-scrollbar{display:none}
.page{flex:none;width:100%;height:100%;scroll-snap-align:start;padding:12px 18px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.wg{background:var(--glass);border:1px solid var(--gline);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:26px;padding:16px 18px;color:#fff}
.wg .k{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
#wClock{display:flex;justify-content:space-between;align-items:flex-end;cursor:pointer}
#wClock .t{font-size:58px;font-weight:200;letter-spacing:-2px;line-height:1}
#wClock .d{font-size:13px;font-weight:600;opacity:.75;margin-top:6px}
#wClock .lg{width:30px;height:30px;display:block;margin-left:auto;opacity:.9}
#wClock .brand{text-align:right;font-size:9.5px;letter-spacing:.32em;font-weight:700;opacity:.6}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wrow .wg{height:104px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.wbig{font-size:30px;font-weight:300;letter-spacing:-1px}
.wsm{font-size:12px;font-weight:600;opacity:.7}
#wBat{flex-direction:row!important;align-items:center;gap:12px}
#wBat .ring{width:62px;height:62px;flex:none;position:relative}
#wBat .ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.gsearch{display:flex;align-items:center;gap:10px;background:#fff;color:#000;border-radius:24px;padding:0 6px 0 16px;height:50px}
.gsearch i{width:18px;height:18px;flex:none;opacity:.6}
.gsearch input{flex:1;border:0;background:none;outline:none;font-size:15px;color:#000;min-width:0}
.gsearch button{width:38px;height:38px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.gsearch button svg{width:17px;height:17px}
.cal .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.cal .mh b{font-size:17px;font-weight:700;text-transform:capitalize}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12.5px;font-weight:600}
.cal .cg .h{opacity:.45;font-size:10.5px;font-weight:700;text-transform:uppercase}
.cal .cg .td{background:#fff;color:#000;border-radius:50%}
.cal .cg span{height:26px;display:flex;align-items:center;justify-content:center}
.cal .cg .o{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;align-content:start;min-height:90px;padding-top:4px}
.icon{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);min-width:0;position:relative;touch-action:pan-x}
.icon span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
.icon .ic{width:60px;height:60px;border-radius:19px;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .15s}
.icon .ic svg{width:26px;height:26px;stroke-width:1.6}
.icon:active .ic{transform:scale(.9)}
.icon .ic.fold{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:9px;background:rgba(255,255,255,.16)}
.icon .ic.fold i{border-radius:6px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;padding:3px}
.icon .ic.fold i svg{width:12px;height:12px;stroke-width:2.2}
.icon .x{position:absolute;top:-6px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;color:#000;font-size:15px;font-weight:800;display:none;align-items:center;justify-content:center;line-height:1;z-index:2;font-style:normal}
.editing #pages .icon .x,.editing #dock .icon .x{display:flex}
.editing #pages .icon .ic,.editing #dock .icon .ic{animation:jig .26s infinite alternate ease-in-out}
.editing #pages .icon:nth-child(2n) .ic{animation-delay:.13s}
@keyframes jig{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.icon.dragging{opacity:.15}
.icon.merge .ic{transform:scale(1.18)!important;box-shadow:0 0 0 3px #fff;animation:none!important}
#ghost{position:absolute;z-index:300;pointer-events:none;display:none;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 12px 18px rgba(0,0,0,.6))}
#ghost .ic{width:60px;height:60px;border-radius:19px;display:flex;align-items:center;justify-content:center;background:rgba(60,60,60,.9);border:1px solid rgba(255,255,255,.3);color:#fff}
#ghost .ic svg{width:26px;height:26px}
#ghost .ic.fold{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:9px}
#ghost .ic.fold i{border-radius:6px;background:rgba(255,255,255,.14);display:flex;padding:3px}
#ghost .ic.fold i svg{width:12px;height:12px}
#dots{display:flex;justify-content:center;gap:7px;padding:8px 0 10px}
#dots b{width:6px;height:6px;border-radius:3px;background:#fff;opacity:.3;transition:all .25s}
#dots b.on{opacity:1;width:18px}
.dock{margin:0 14px 56px;background:var(--glass);border:1px solid var(--gline);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:32px;padding:12px 8px;display:grid;grid-template-columns:repeat(4,1fr);min-height:86px}
.dock .icon span{display:none}

#drawer{position:absolute;inset:0;z-index:90;background:rgba(0,0,0,.82);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:50px 18px 60px;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
#drawer.open{transform:none}
#drawer .srch{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid var(--gline);border-radius:22px;padding:0 16px;margin-bottom:22px}
#drawer .srch i{width:18px;height:18px;opacity:.6;flex:none}
#drawer input{flex:1;border:0;background:none;color:#fff;font-size:15px;padding:13px 0;outline:none}
#drawer input::placeholder{color:rgba(255,255,255,.5)}
#drawer .grid{overflow:auto;padding-bottom:10px}
#drawer .pull{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);margin:-30px auto 22px}
#drawer .dh{font-size:11px;opacity:.5;text-align:center;margin-bottom:12px;font-weight:600}

#folder{position:absolute;inset:0;z-index:95;background:rgba(0,0,0,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center}
#fPanel{width:86%;background:rgba(40,40,40,.75);border:1px solid var(--gline);border-radius:34px;padding:20px 16px 22px;animation:pop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#fName{background:none;border:0;color:#fff;font-size:22px;font-weight:700;text-align:center;width:100%;outline:none;margin-bottom:12px}
#fIcons{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
#fIcons button{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;padding:7px}
#fIcons button.sel{background:#fff;color:#000}
#fGrid{grid-template-columns:repeat(3,1fr);max-height:340px;overflow:auto}

#nav{position:absolute;bottom:0;left:0;right:0;height:46px;display:flex;justify-content:space-around;align-items:center;z-index:120;color:#fff}
#nav button{width:60px;height:40px;display:flex;align-items:center;justify-content:center;opacity:.8}
#nav button svg{width:19px;height:19px}

.app{position:absolute;inset:0;background:var(--bg);color:var(--fg);padding:34px 0 46px;display:flex;flex-direction:column;z-index:60;opacity:0;transform:scale(.88);pointer-events:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s;border-radius:34px;overflow:hidden}
.app.show{opacity:1;transform:none;pointer-events:auto;border-radius:0}
.app.game{background:#0a0a0a;color:#fff}
.ah{padding:14px 20px 10px;font-size:30px;font-weight:300;letter-spacing:-.5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ab{flex:1;overflow:auto;padding:0 18px 18px}
.card{background:var(--card);border-radius:22px;padding:4px 0;margin-bottom:14px;border:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;font-size:14.5px;font-weight:600;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:3px;line-height:1.4}
.row .v{color:var(--muted);text-align:right;font-weight:500}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin:20px 6px 8px}
.sw{width:50px;height:30px;border-radius:15px;background:#333;position:relative;transition:background .2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#888;transition:all .2s}
.sw.on{background:#fff}.sw.on:after{left:23px;background:#000}
.btn{background:var(--accent);color:var(--onacc);border-radius:16px;padding:12px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--card2);color:var(--fg)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--card2);border-radius:16px;padding:4px}
.seg button{flex:1 1 auto;padding:9px 10px;border-radius:12px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.sel{background:#fff;color:#000}
input[type=range]{width:100%;accent-color:#fff}
.inp{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#0b0b0b;color:#fff;font-size:15px;outline:none;margin-bottom:10px}

/* camera viewer */
#app-camview{background:#000}
#cvImg{flex:1;margin:10px 14px;border-radius:24px;background:#111 center/contain no-repeat}

/* quick settings */
#shade{position:absolute;top:0;left:0;right:0;z-index:170;background:rgba(12,12,12,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#fff;padding:44px 18px 14px;border-radius:0 0 34px 34px;transform:translateY(-105%);transition:transform .36s cubic-bezier(.2,.8,.2,1);touch-action:none;border-bottom:1px solid var(--gline)}
#shade.open{transform:none}
#shade .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
#shade .top .t{font-size:38px;font-weight:200}
#shade .top .d{font-size:12.5px;opacity:.6;font-weight:600}
.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.qs button{height:66px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:9.5px;font-weight:700;padding:0 2px;transition:all .2s;line-height:1.15;text-align:center}
.qs button svg{width:19px;height:19px}
.qs button.on{background:#fff;color:#000}
.bright{display:flex;align-items:center;gap:12px;margin:14px 4px 4px}
.bright i{width:19px;height:19px;flex:none}
.nlist{margin-top:10px;max-height:150px;overflow:auto}
.nitem{background:rgba(255,255,255,.07);border-radius:18px;padding:11px 14px;font-size:12.5px;margin-bottom:8px;line-height:1.4}
.nitem b{display:block;font-size:13px}
.handle{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);margin:10px auto 0}

#dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:390;opacity:0}
#torch{position:absolute;inset:0;background:#fff;z-index:380;display:none;align-items:flex-end;justify-content:center;color:#999;font-size:13px;font-weight:600;padding-bottom:70px}
#amb{position:absolute;inset:0;background:#000;z-index:350;display:none;cursor:pointer}
#amb .c{position:absolute;text-align:center;transition:all 2s ease;width:100%}
#amb .t{font-size:96px;font-weight:200;letter-spacing:-3px;color:#e8e8e8}
#amb .d{font-size:14px;color:#777;font-weight:600;letter-spacing:.1em}
#chg{position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:360;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#chg .ring{width:190px;height:190px;position:relative}
#chg .ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:200}
#chg circle.p{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
#chg .l{font-size:13px;letter-spacing:.3em;font-weight:600;opacity:.7;text-transform:uppercase}
#vo{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:340;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:30px}
#vo .orb{width:110px;height:110px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;animation:orb 1.4s infinite}
#vo .orb i{width:40px;height:40px}
@keyframes orb{0%{box-shadow:0 0 0 0 rgba(255,255,255,.4)}100%{box-shadow:0 0 0 36px rgba(255,255,255,0)}}
#vo b{font-size:22px;font-weight:300}
#vo span{font-size:13px;opacity:.6;font-weight:600}
#mod{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:330;display:none;align-items:center;justify-content:center;padding:22px}
#mod .box{background:#151515;border:1px solid var(--line);border-radius:26px;padding:20px;width:100%}
#mod .gl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
#mod .gl button{width:38px;height:38px;border-radius:12px;background:#222;padding:9px}
#mod .gl button.sel{background:#fff;color:#000}

#recents{position:absolute;inset:0;z-index:110;background:rgba(0,0,0,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;flex-direction:column;padding:60px 0}
#recents .list{flex:1;display:flex;gap:16px;overflow-x:auto;padding:20px 40px;align-items:center;scroll-snap-type:x mandatory}
.rcard{flex:none;width:220px;height:420px;border-radius:28px;background:#111;border:1px solid var(--line);scroll-snap-align:center;display:flex;flex-direction:column;overflow:hidden}
.rcard .h{display:flex;align-items:center;gap:10px;padding:14px;font-weight:700;font-size:14px}
.rcard .h i{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#222;padding:5px}
.rcard .body{flex:1;margin:0 14px 14px;border-radius:18px;background:#1a1a1a}
#recents .clr{align-self:center;background:#fff;color:#000;padding:10px 22px;border-radius:20px;font-weight:700;font-size:14px}
#toast{position:absolute;top:42px;left:12px;right:12px;z-index:320;background:rgba(22,22,22,.95);border:1px solid var(--gline);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;border-radius:22px;padding:12px 16px;font-size:13px;line-height:1.4;transform:translateY(-170%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;gap:12px;align-items:center}
#toast.show{transform:none}
#toast .lg{width:30px;height:30px;flex:none}
#toast b{display:block}

/* games shared */
.stage{flex:1;position:relative;overflow:hidden;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:800;font-size:14px;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.5);z-index:2}
.hud span{background:rgba(0,0,0,.35);padding:6px 12px;border-radius:14px}
.stick{position:absolute;left:18px;bottom:18px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);z-index:2;touch-action:none}
.stick b{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
.gbtn{position:absolute;border-radius:50%;z-index:2;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;touch-action:none;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.gbtn:active{transform:scale(.92)}
.overlay{position:absolute;inset:0;background:rgba(10,8,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
.overlay h2{margin:0;font-size:30px;font-weight:800}
.overlay p{margin:0;opacity:.8;font-weight:600;line-height:1.45}

/* 2048 */
.b2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#3a3446;padding:8px;border-radius:18px;width:min(330px,88vw);aspect-ratio:1;touch-action:none}
.b2048 div{border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px}
/* piano */
.piano{position:relative;height:230px;margin:0 10px;display:flex}
.piano .w{flex:1;background:#fff;border:1px solid #bbb;border-radius:0 0 10px 10px;margin:0 1px;color:#999;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11px;font-weight:700}
.piano .w.on{background:color-mix(in srgb,var(--accent) 30%,#fff)}
.piano .k{position:absolute;top:0;height:140px;background:#17151a;border-radius:0 0 8px 8px;z-index:2}
.piano .k.on{background:var(--accent)}
.colors{display:flex;gap:10px;justify-content:center;padding:10px}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.colors button.sel{border-color:var(--fg)}


</style>

  if(!l){if(f!==curFolder)delete S.folders[f];continue}
  if(it.length===0){l.a.splice(l.a.indexOf(f),1);delete S.folders[f]}else if(it.length===1&&f!==curFolder){l.a[l.a.indexOf(f)]=it[0];delete S.folders[f]}}

function moveDrag(e){posGhost(e.clientX,e.clientY);ghost.style.display='none';const under=document.elementFromPoint(e.clientX,e.clientY);ghost.style.display='block';
 if(curFolder){const r=$('fPanel').getBoundingClientRect();
  if(e.clientX<r.left-10||e.clientX>r.right+10||e.clientY<r.top-10||e.clientY>r.bottom+10){const f=curFolder;closeFolder(true);removeId(drag.id);(S.pages[curPage()]||S.pages[0]).push(drag.id);renderGrids();return}
  const tg=under?.closest('#fGrid .icon[data-id]');if(tg&&tg.dataset.id!==drag.id&&drag.last!==tg.dataset.id){drag.last=tg.dataset.id;reorder(drag.id,tg.dataset.id);renderFolder()}return}
 const sr=$('screen').getBoundingClientRect(),ex=e.clientX-sr.left;
 if(ex<26||ex>sr.width-26){if(!drag.edgeT)drag.edgeT=performance.now();else if(performance.now()-drag.edgeT>520){drag.edgeT=0;const dir=ex<26?-1:1;let p=curPage()+dir;
   if(dir>0&&p>=S.pages.length){S.pages.push([]);renderGrids()}if(p>=0&&p<S.pages.length){scrollToPage(p);snd('swipe')}}}else drag.edgeT=0;
 const tg=under?.closest('#pages .icon[data-id],#dock .icon[data-id]');
 if(tg&&tg.dataset.id!==drag.id){const tid=tg.dataset.id,r=tg.querySelector('.ic').getBoundingClientRect();
  const inner=Math.abs(e.clientX-(r.left+r.width/2))<r.width*.3&&Math.abs(e.clientY-(r.top+r.height/2))<r.height*.3;
  if(inner&&!isF(drag.id)){clearTimeout(drag.rt);drag.cand=null;if(drag.merge!==tid){drag.merge=tid;drag.mergeT=performance.now();markMerge()}return}
  clearMerge();if(drag.last!==tid&&drag.cand!==tid){drag.cand=tid;clearTimeout(drag.rt);const dd=drag;drag.rt=setTimeout(()=>{if(drag!==dd||dd.cand!==tid||dd.merge)return;dd.last=tid;dd.cand=null;const tl=locOf(tid);if(!tl||(tl.c==='dock'&&!S.dock.includes(dd.id)&&S.dock.length>=5))return;reorder(dd.id,tid);renderGrids()},260)}
 }else{clearTimeout(drag.rt);drag.cand=null;clearMerge();const g=under?.closest('[data-grid],#dock');if(g&&!tg){const arr=g.id==='dock'?S.dock:S.pages[+g.dataset.grid];if(arr&&arr[arr.length-1]!==drag.id&&!(g.id==='dock'&&!S.dock.includes(drag.id)&&S.dock.length>=5)){removeId(drag.id);arr.push(drag.id);drag.last=null;renderGrids()}}}}
function reorder(id,tid){const tl=locOf(tid);if(!tl)return;const sl=locOf(id);const same=sl&&sl.a===tl.a;const oi=same?tl.a.indexOf(id):-1,ti=tl.a.indexOf(tid);removeId(id);let ni=tl.a.indexOf(tid);if(same&&oi<ti)ni++;tl.a.splice(ni,0,id)}
function markMerge(){document.querySelectorAll('.icon.merge').forEach(x=>x.classList.remove('merge'));const el=document.querySelector(`#pages .icon[data-id="${drag.merge}"],#dock .icon[data-id="${drag.merge}"]`);if(el){el.classList.add('merge');vib(10)}}

  else{const fid='f_'+Date.now().toString(36);const ml=locOf(m);ml.a[ml.a.indexOf(m)]=fid;removeId(d.id);S.folders[fid]={n:null,k:'folder',items:[m,d.id]}}
  snd('folder');vib([15,40,15])}else snd('drop');
 cleanup();renderGrids();setTimeout(()=>suppress=false,350)}

(function(){const st=$('obSt'),stick=makeStick($('obStick'));let ok=!!window.THREE,R,scene,cam,pl=[],kill=[],player,clock,run=false,raf;

 function build(){const T=THREE;R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.domElement.style.cssText='position:absolute;inset:0;width:100%;height:100%';st.prepend(R.domElement);

  let s=11;const rn=()=>(s=(s*16807)%2147483647)/2147483647;
  const COLS=['#ff5e62','#ffb347','#7b4bff','#2fc26b','#3ad1ff','#ff2d8a','#ffd60a'];
  const add=(o)=>{const m=new T.Mesh(new T.BoxGeometry(o.w,o.h,o.d),new T.MeshLambertMaterial({color:o.color}));m.position.set(o.x,o.y,o.z);scene.add(m);o.mesh=m;o.bx=o.x;o.by=o.y;pl.push(o);return o};

   if(mv){const ax=rn()<.5?'x':'y';o.mv={ax,amp:ax==='x'?2.2:1,sp:1+rn(),ph:rn()*6}}

   if(cp||fin){const pole=new T.Mesh(new T.CylinderGeometry(.08,.08,3),new T.MeshLambertMaterial({color:'#fff'}));pole.position.set(X+w/2-.5,Y+2,Z);scene.add(pole);const fl=new T.Mesh(new T.BoxGeometry(1,.6,.05),new T.MeshLambertMaterial({color:fin?'#ff2d8a':'#2fc26b'}));fl.position.set(X+w/2,Y+3.1,Z);scene.add(fl)}}
  for(let i=0;i<14;i++){const c=new T.Mesh(new T.BoxGeometry(6+rn()*6,1.5,3+rn()*3),new T.MeshBasicMaterial({color:'#fff'}));c.position.set((rn()-.5)*80,18+rn()*10,-rn()*200+20);scene.add(c)}

 function size(){const r=st.getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}

  p={x:cpPos.mesh.position.x,y:cpPos.mesh.position.y+.5,z:cpPos.mesh.position.z};vel={y:0};ground=null;$('obStage').textContent=cpIdx;$('obD').textContent=deaths}
 function die(){deaths++;snd('fail');reset(false)}
 const jp=e=>{e.preventDefault();e.stopPropagation();jumpQ=true};$('obJump').addEventListener('pointerdown',jp);
 document.addEventListener('keydown',e=>{if(current==='obby'&&e.code==='Space')jumpQ=true});
 (function(){let id=null,lx,ly;st.addEventListener('pointerdown',e=>{if(e.target!==R?.domElement)return;id=e.pointerId;lx=e.clientX;ly=e.clientY});
  st.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;yaw-=(e.clientX-lx)*.008;pitch=Math.max(.05,Math.min(1.1,pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});
  const up=e=>{if(e.pointerId===id)id=null};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up)})();
 function step(dt,tm){
  for(const o of pl){if(!o.mv)continue;const ox=o.mesh.position.x,oy=o.mesh.position.y;const v=Math.sin(tm*o.mv.sp+o.mv.ph)*o.mv.amp;if(o.mv.ax==='x')o.mesh.position.x=o.bx+v;else o.mesh.position.y=o.by+v+o.mv.amp;o.dx=o.mesh.position.x-ox;o.dy=o.mesh.position.y-oy}
  for(const k of kill){k.m.position.x=k.o.mesh.position.x;k.m.position.y=k.o.mesh.position.y+.75}
  if(won)return;
  const kb=kbAxis();let sx=stick.x+kb.x,sy=stick.y+kb.y;const m=Math.hypot(sx,sy);if(m>1){sx/=m;sy/=m}
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const mx=fx*-sy+rx*sx,mz=fz*-sy+rz*sx;const sp=7;
  if(ground&&ground.dx!==undefined){p.x+=ground.dx||0;p.y+=ground.dy||0}
  p.x+=mx*sp*dt;p.z+=mz*sp*dt;
  if(m>.1){player.rotation.y=Math.atan2(-mx,-mz);const sw=Math.sin(tm*12)*.5;player.userData.legs[0].rotation.x=sw;player.userData.legs[1].rotation.x=-sw}else player.userData.legs.forEach(l=>l.rotation.x=0);

  for(const o of pl){const q=o.mesh.position,top=q.y+o.h/2;if(Math.abs(p.x-q.x)<o.w/2+.25&&Math.abs(p.z-q.z)<o.d/2+.25&&py>=top-.25&&p.y<=top&&vel.y<=0){p.y=top;vel.y=0;ground=o;
    if(o.type==='cp'){const idx=pl.filter(z=>z.type==='cp').indexOf(o);if(idx>cpIdx){cpIdx=idx;cpPos=o;$('obStage').textContent=cpIdx;toast(t('obby'),'🚩 '+cpIdx)}}
    if(o.type==='fin'){won=true;const tt=((performance.now()-t0)/1000).toFixed(1);$('obMsg').textContent=t('obbyWin',{t:tt,d:deaths});$('obGo').textContent=t('again');$('obOv').style.display='flex';stick.reset()}}}
  for(const k of kill){const q=k.m.position;if(Math.abs(p.x-q.x)<k.w/2+.2&&Math.abs(p.z-q.z)<.5&&p.y<q.y+.3&&p.y+1.9>q.y-.25){die();return}}

  $('obTime').textContent=((performance.now()-t0)/1000).toFixed(1)}

(function(){const c=$('snC'),x=c.getContext('2d'),N=15,Z=20;let sn,dir,nd,food,score,loop,best=store.get('best',0);$('snB').textContent=best;
 function place(){do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(sn.some(s=>s[0]===food[0]&&s[1]===food[1]))}

  const ac=getComputedStyle(document.documentElement).getPropertyValue('--accent');sn.forEach((s,i)=>{x.fillStyle=i?ac:'#2fc26b';x.beginPath();x.roundRect?x.roundRect(s[0]*Z+1,s[1]*Z+1,Z-2,Z-2,6):x.rect(s[0]*Z+1,s[1]*Z+1,Z-2,Z-2);x.fill()})}
 function start(){sn=[[7,7],[6,7],[5,7]];dir=[1,0];nd=dir;score=0;$('snS').textContent=0;place();clearInterval(loop);loop=setInterval(step,130);$('snGo').textContent=t('again')}
 function step(){dir=nd;const h=[sn[0][0]+dir[0],sn[0][1]+dir[1]];
  if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(s=>s[0]===h[0]&&s[1]===h[1])){clearInterval(loop);if(score>best){best=score;store.set('best',best);$('snB').textContent=best}toast(t('snake'),t('gameOver',{n:score}));$('snGo').textContent=t('play');return}
  sn.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){score++;$('snS').textContent=score;place()}else sn.pop();draw()}

 let t0=null;c.addEventListener('pointerdown',e=>t0=[e.clientX,e.clientY]);c.addEventListener('pointerup',e=>{if(!t0)return;const dx=e.clientX-t0[0],dy=e.clientY-t0[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20)turn(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]);t0=null});

 sn=[[7,7],[6,7],[5,7]];dir=[1,0];food=[11,7];APPS.snake.onOpen=draw;APPS.snake.onClose=()=>{clearInterval(loop);$('snGo').textContent=t('play')};

(function(){let b,score,best=store.get('b2048',0);const el=$('g2');el.innerHTML='<div></div>'.repeat(16);$('g2B').textContent=best;
 const COL={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};

 function move(d){let moved=false;for(const ln of LINES[d]){const v=ln.map(i=>b[i]).filter(Boolean),o=[];for(let i=0;i<v.length;i++){if(v[i]===v[i+1]){o.push(v[i]*2);score+=v[i]*2;i++}else o.push(v[i])}while(o.length<4)o.push(0);ln.forEach((i,k)=>{if(b[i]!==o[k])moved=true;b[i]=o[k]})}

(function(){let ac;const el=$('pno');const WH=['C','D','E','F','G','A','B','C','D','E'];const base=[0,2,4,5,7,9,11,12,14,16];
